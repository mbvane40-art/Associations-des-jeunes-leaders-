version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ajl_postgres
    environment:
      POSTGRES_DB: ajl_db
      POSTGRES_USER: ajl_user
      POSTGRES_PASSWORD: ajl_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ajl_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ajl_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ajl_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ajl_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  ajl_network:
    driver: bridge
